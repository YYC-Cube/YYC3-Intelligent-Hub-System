name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # PR 上新提交直接取消旧运行（省额度）；main 保持串行部署不取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 22：dev 链 undici@8（jsdom→vitest 测试栈）engines 要求 >=22.19，Node 20 下模块加载即崩
  NODE_VERSION: "22.x"
  PNPM_VERSION: "10.x"

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint gate
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Vitest test gate
        run: pnpm test

      # 生产依赖安全门禁：高危漏洞即失败
      # （braces/GHSA-vfj7-8cjw-p6xm 已随构建工具迁入 devDependencies 而退出生产树）
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      # 全量依赖安全门禁（含 dev 链）：阻断新引入的高危传递依赖；
      # 无上游修复的既有项在 pnpm-workspace.yaml auditConfig 中豁免并注明依据
      - name: Full dependency audit
        run: pnpm audit --audit-level=high

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_DATE: ${{ github.event.head_commit.timestamp }}

      - name: Add CNAME
        run: echo "nexus.yyc3.vip" > out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://nexus.yyc3.vip
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
