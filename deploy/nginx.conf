# YYC3 Intelligent Hub —— 静态导出站点 nginx 配置
# 产物结构：output: 'export' + trailingSlash（目录/index.html 形态）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 精确命中 → 目录 index → 兜底 404 页（与 Web 端 StatusPage 404 一致）
    location / {
        try_files $uri $uri/ /404.html;
    }

    # 指纹类静态资源长缓存；HTML 短缓存保证发版即生效
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
